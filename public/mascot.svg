<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Wings -->
  <ellipse cx="55" cy="115" rx="30" ry="45" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5" transform="rotate(-15 55 115)" opacity="0.8"/>
  <ellipse cx="145" cy="115" rx="30" ry="45" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5" transform="rotate(15 145 115)" opacity="0.8"/>
  <!-- Body / White coat -->
  <rect x="65" y="130" width="70" height="75" rx="20" fill="white" stroke="#7dd3fc" stroke-width="2"/>
  <!-- Coat buttons -->
  <circle cx="100" cy="155" r="2.5" fill="#7dd3fc"/>
  <circle cx="100" cy="170" r="2.5" fill="#7dd3fc"/>
  <circle cx="100" cy="185" r="2.5" fill="#7dd3fc"/>
  <!-- Coat pocket -->
  <rect x="110" y="172" width="15" height="12" rx="3" fill="none" stroke="#bae6fd" stroke-width="1.2"/>
  <!-- Stethoscope -->
  <path d="M85 130 Q80 145 78 155" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="78" cy="158" r="5" fill="#38bdf8"/>
  <circle cx="78" cy="158" r="2.5" fill="#e0f2fe"/>
  <!-- Head -->
  <circle cx="100" cy="85" r="50" fill="#fffbeb" stroke="#7dd3fc" stroke-width="2"/>
  <!-- Hair -->
  <ellipse cx="100" cy="55" rx="52" ry="35" fill="#bae6fd"/>
  <ellipse cx="60" cy="75" rx="18" ry="30" fill="#bae6fd"/>
  <ellipse cx="140" cy="75" rx="18" ry="30" fill="#bae6fd"/>
  <ellipse cx="100" cy="45" rx="45" ry="22" fill="#7dd3fc" opacity="0.3"/>
  <!-- Hair bangs -->
  <path d="M58 68 Q75 82 80 65 Q85 80 100 62 Q115 80 120 65 Q125 82 142 68" fill="#bae6fd" stroke="#7dd3fc" stroke-width="0.5"/>
  <!-- Bow -->
  <ellipse cx="80" cy="38" rx="18" ry="12" fill="#a5f3fc" stroke="#22d3ee" stroke-width="1.5" transform="rotate(-20 80 38)"/>
  <ellipse cx="120" cy="38" rx="18" ry="12" fill="#a5f3fc" stroke="#22d3ee" stroke-width="1.5" transform="rotate(20 120 38)"/>
  <circle cx="100" cy="40" r="5" fill="#22d3ee"/>
  <!-- Eyes -->
  <ellipse cx="82" cy="90" rx="8" ry="9" fill="#0284c7"/>
  <ellipse cx="118" cy="90" rx="8" ry="9" fill="#0284c7"/>
  <!-- Eye highlights -->
  <circle cx="85" cy="87" r="3.5" fill="white"/>
  <circle cx="121" cy="87" r="3.5" fill="white"/>
  <circle cx="80" cy="93" r="1.8" fill="white" opacity="0.7"/>
  <circle cx="116" cy="93" r="1.8" fill="white" opacity="0.7"/>
  <!-- Blush -->
  <ellipse cx="70" cy="100" rx="8" ry="4" fill="#fecdd3" opacity="0.5"/>
  <ellipse cx="130" cy="100" rx="8" ry="4" fill="#fecdd3" opacity="0.5"/>
  <!-- Mouth -->
  <path d="M93 103 Q100 110 107 103" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
  <!-- Sparkles -->
  <g fill="#fbbf24" opacity="0.7">
    <polygon points="45,50 47,45 49,50 47,55" transform="scale(0.8)"/>
    <polygon points="190,60 192,55 194,60 192,65" transform="scale(0.8)"/>
    <polygon points="170,100 172,95 174,100 172,105" transform="scale(0.8)"/>
    <polygon points="35,90 37,85 39,90 37,95" transform="scale(0.8)"/>
  </g>
  <!-- Clipboard -->
  <rect x="120" y="148" width="28" height="36" rx="3" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="130" y="145" width="8" height="6" rx="2" fill="#6ee7b7"/>
  <line x1="126" y1="158" x2="142" y2="158" stroke="#86efac" stroke-width="1.5"/>
  <line x1="126" y1="164" x2="142" y2="164" stroke="#86efac" stroke-width="1.5"/>
  <line x1="126" y1="170" x2="138" y2="170" stroke="#86efac" stroke-width="1.5"/>
  <!-- Check marks on clipboard -->
  <path d="M125 157 l2 2 l4 -4" fill="none" stroke="#22c55e" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M125 163 l2 2 l4 -4" fill="none" stroke="#22c55e" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Feet -->
  <ellipse cx="85" cy="208" rx="12" ry="6" fill="white" stroke="#7dd3fc" stroke-width="1.5"/>
  <ellipse cx="115" cy="208" rx="12" ry="6" fill="white" stroke="#7dd3fc" stroke-width="1.5"/>
</svg>
